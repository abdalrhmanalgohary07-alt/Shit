name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unzip project
        run: |
          mkdir work
          unzip -q FloatLauncher-project.zip -d work
          echo "DIR=$(dirname "$(find work -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: cd "$DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FloatLauncher-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
